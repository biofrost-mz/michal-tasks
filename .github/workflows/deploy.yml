# Deploy — build v CI + publikace na GitHub Pages, dist mimo git.
#
# Předpoklady (nastav JEDNOU v repo Settings, jinak deploy selže / shodí doménu):
#   1. Settings → Secrets and variables → Actions → New repository secret:
#        VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   2. Settings → Pages → Source = "GitHub Actions"
#   3. Custom doména tasks.zichmichal.cz drží public/CNAME (kopíruje se do dist).
#
# První nasazení lze spustit ručně (workflow_dispatch) a ověřit ještě před mergem.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nepřerušovat běžící deploy novým pushnutím — ať se web nezasekne v půlce.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build (baked VITE_SUPABASE_* z secrets)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Ověř, že se do dist zapekla Supabase konfigurace
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::Build neobsahuje Supabase konfiguraci — chybí secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY?"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
